[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-code-generator"
version = "0.2.0"
description = "Deterministic, compatibility-aware RAG project generator"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.117,<1"]

[project.scripts]
raggen = "rag_generator.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.setuptools.packages.find]
include = ["rag_generator*"]

[tool.setuptools.package-data]
rag_generator = ["catalog/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.vercel]
entrypoint = "app:app"
